# AVX2 + FMA (every x86 CPU since ~2015): the tracker's own loops and tract's generic kernels
# vectorize with it. Measured: landmark model -21 %, eye/mouth cut -32 %, optical flow -51 %.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]
