name: Release

# Conventional commits on main -> release-please keeps a release PR (version, CHANGELOG.md, PKGBUILD).
# Merging it tags vX.Y.Z, creates the GitHub release and attaches the Linux binary.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  binary:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # provenance: signs with the workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev nasm clang
      - run: rustup update stable && rustup default stable
      - run: cargo build --release --locked
      - id: pack
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          name="avatar-rs-$TAG-x86_64-linux"
          mkdir "$name" && cp target/release/avatar-rs README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
      # `gh attestation verify FILE --owner OWNER` checks the binary came from this workflow.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          FILE: ${{ steps.pack.outputs.file }}
        run: gh release upload "$TAG" "$FILE" "$FILE.sha256" --repo "$GITHUB_REPOSITORY"
